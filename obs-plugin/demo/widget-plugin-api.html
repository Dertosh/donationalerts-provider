<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Виджет через API плагина OBS</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #11131a; color: #eef0f6; }
    body { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    input, button { min-height: 42px; padding: 8px 12px; border: 1px solid #454c5e; border-radius: 7px; font: inherit; }
    input { width: min(100%, 560px); background: #1c202b; color: inherit; }
    button { cursor: pointer; background: #7654e8; color: white; }
    pre { min-height: 160px; padding: 14px; overflow: auto; background: #1c202b; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; }
    [role="status"] { min-height: 1.5em; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Виджет через API плагина OBS</h1>
  <p>Использует локальный API плагина и временный ключ виджета. OAuth-токен DonationAlerts не покидает OBS.</p>
  <label for="token">Временный ключ с доступом «События донатов»</label><br>
  <input id="token" type="password" autocomplete="off" placeholder="Ключ из панели DonationAlerts Provider">
  <button id="connect" type="button">Подключить</button>
  <p id="status" role="status">Введите ключ и нажмите «Подключить».</p>
  <h2>Профиль и история</h2>
  <pre id="snapshot">Нет данных.</pre>
  <h2>Realtime-события</h2>
  <pre id="events">Ожидаю подключения.</pre>
  <script>
    "use strict";

    const apiBase = "http://127.0.0.1:4041";
    const socketBase = "ws://127.0.0.1:4043/api/widget/events";
    const tokenInput = document.getElementById("token");
    const status = document.getElementById("status");
    const snapshot = document.getElementById("snapshot");
    const events = document.getElementById("events");
    let socket = null;

    document.getElementById("connect").addEventListener("click", async () => {
      const token = tokenInput.value.trim();
      if (!token) {
        status.textContent = "Введите временный ключ виджета.";
        return;
      }

      status.textContent = "Запрашиваю /api/widget/data…";
      try {
        const response = await fetch(`${apiBase}/api/widget/data`, {
          cache: "no-store",
          headers: { Authorization: `Bearer ${token}` }
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
        snapshot.textContent = JSON.stringify(body, null, 2);
        status.textContent = "Подключено к API плагина.";

        if (socket) socket.close();
        socket = new WebSocket(socketBase, ["donationalerts-widget-v1", token]);
        socket.addEventListener("message", message => {
          try {
            events.textContent = JSON.stringify(JSON.parse(message.data), null, 2);
          } catch (error) {
            events.textContent = `Некорректное событие: ${error.message}`;
          }
        });
        socket.addEventListener("open", () => { events.textContent = "Realtime-сокет подключён; ожидаю события."; });
        socket.addEventListener("close", event => {
          events.textContent = `Realtime-сокет закрыт: код ${event.code}${event.reason ? `, ${event.reason}` : ""}`;
        });
      } catch (error) {
        status.textContent = `Ошибка: ${error.message}`;
      }
    });

    window.addEventListener("beforeunload", () => socket?.close());
  </script>
</body>
</html>
